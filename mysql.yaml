apiVersion: v1
kind: Service
metadata:
  name: quicknook-mysql
  namespace: quicknook
spec:
  selector:
    app: quicknook-mysql
  ports:
    - port: 3306
      targetPort: 3306
  clusterIP: None

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: quicknook-mysql
  namespace: quicknook
spec:
  serviceName: quicknook-mysql
  replicas: 1

  selector:
    matchLabels:
      app: quicknook-mysql

  template:
    metadata:
      labels:
        app: quicknook-mysql

    spec:
      containers:
        - name: mysql
          image: mysql:8.0

          ports:
            - containerPort: 3306

          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: quicknook-secret
                  key: MYSQL_ROOT_PASSWORD

            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: quicknook-secret
                  key: MYSQL_DATABASE

          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql

  volumeClaimTemplates:
    - metadata:
        name: mysql-data

      spec:
        accessModes:
          - ReadWriteOnce

        resources:
          requests:
            storage: 20Gi
